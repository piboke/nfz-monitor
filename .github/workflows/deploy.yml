name: GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'tests/**', 'README.md']
  workflow_run:
    workflows: ['Synchronizacja NFZ']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dołącz ostatni kompletny zbiór z gałęzi danych
        uses: actions/checkout@v4
        continue-on-error: true
        id: archive
        with:
          ref: data
          path: archive
          persist-credentials: false
          sparse-checkout: data
      - name: Wybierz zestaw danych
        shell: bash
        run: |
          if test -f archive/data/manifest.json; then
            rm -rf data
            cp -R archive/data data
          fi
          node scripts/validate-data.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/atlas-web/package-lock.json
      - run: npm ci --prefix src/atlas-web
      - run: npm run check --prefix src/atlas-web
      - run: npm test --prefix src/atlas-web
      - run: npm run build --prefix src/atlas-web -- --base-href '/${{ github.event.repository.name }}/'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/atlas-web/dist/atlas-web/browser
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Opublikuj
        id: deployment
        uses: actions/deploy-pages@v4
