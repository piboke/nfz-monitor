name: Synchronizacja NFZ
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nfz-data-writer
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    # ETL uses six workers with one global 350ms request pacing gate.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Otwórz trwałą gałąź danych
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch origin data
            git worktree add --detach archive FETCH_HEAD
          else
            status=$?
            test "$status" -eq 2 || exit "$status"
            git worktree add --detach archive HEAD
            git -C archive switch --orphan data
            mkdir -p archive/data
            cp -R data/. archive/data/
          fi
      - name: Pobierz, zweryfikuj i opublikuj atomowo
        id: etl
        continue-on-error: true
        run: dotnet run --project src/NfzAtlas.ETL --configuration Release -- --data archive/data --work archive/checkpoints
      - name: Zapisz obserwacje lub checkpointy
        if: always() && steps.etl.outcome != 'skipped'
        shell: bash
        run: |
          test -d archive/.git || test -f archive/.git
          git -C archive config user.name 'github-actions[bot]'
          git -C archive config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f archive/checkpoints/run.lock
          printf '%s\n' '*.tmp' 'run.lock' '/data.staging/' '/data.backup/' > archive/.gitignore
          git -C archive add -A
          if ! git -C archive diff --cached --quiet; then
            git -C archive commit -m "NFZ: obserwacje i checkpointy $(date -u +%FT%TZ)"
            git -C archive push origin HEAD:refs/heads/data
          fi
      - name: Zgłoś nieudaną synchronizację
        if: steps.etl.outcome == 'failure'
        run: exit 1
